<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Adaptify Wiki Chat</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, system-ui, sans-serif; height: 100vh; display: flex; color: #222; }
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { padding: 10px 16px; border-bottom: 1px solid #ddd; font-weight: 600; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; }
  .msg { margin: 10px 0; padding: 10px 14px; border-radius: 10px; max-width: 80ch; white-space: pre-wrap; line-height: 1.4; }
  .msg.user { background: #e6edff; margin-left: auto; }
  .msg.assistant { background: #f4f4f4; }
  .msg.error { background: #ffecec; color: #a00; }
  .input-row { display: flex; border-top: 1px solid #ddd; padding: 10px; gap: 8px; }
  #input { flex: 1; resize: none; border: 1px solid #ccc; border-radius: 6px; padding: 8px; font: inherit; }
  #send { padding: 8px 18px; border: none; background: #4a6cf7; color: white; border-radius: 6px; cursor: pointer; font: inherit; }
  #send:disabled { background: #aaa; cursor: not-allowed; }
  aside { width: 300px; border-left: 1px solid #ddd; overflow-y: auto; padding: 14px; font-size: 13px; background: #fafafa; }
  aside h3 { margin: 0 0 8px 0; font-size: 13px; text-transform: uppercase; color: #666; letter-spacing: .05em; }
  .source { padding: 6px 0; border-bottom: 1px solid #eee; }
  .source .id { display: inline-block; min-width: 22px; color: #888; font-variant-numeric: tabular-nums; }
  .source a.path { color: #06c; word-break: break-all; text-decoration: none; }
  .source a.path:hover { text-decoration: underline; }
  .source .heading { color: #666; font-size: 12px; margin-left: 22px; }
  .state-tag { display: inline-block; background: #ffe9b3; color: #755200; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; margin-bottom: 8px; letter-spacing: .03em; }
  a.cite { color: #4a6cf7; text-decoration: none; font-weight: 600; padding: 0 1px; }
  a.cite:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="main">
  <header>Adaptify Wiki — RAG Chat</header>
  <div id="messages"></div>
  <div class="input-row">
    <textarea id="input" rows="2" placeholder="Ask about forms, coverages, state rules (e.g., 'Does the intra-family exclusion apply in Alaska?')"></textarea>
    <button id="send">Send</button>
  </div>
</div>
<aside>
  <h3>Sources</h3>
  <div id="sources"><em style="color:#888">Sources for the latest answer appear here.</em></div>
</aside>
<script>
const messagesEl = document.getElementById('messages');
const sourcesEl  = document.getElementById('sources');
const inputEl    = document.getElementById('input');
const sendBtn    = document.getElementById('send');
const history = [];

const GH_BASE = 'https://github.com/pvrajesh11/adaptify-wiki/blob/main/wiki/';
let currentSources = [];

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function addMsg(role, text = '') {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function renderSources(list, state) {
  currentSources = list;
  const header = state ? `<div class="state-tag">state filter: ${state}</div>` : '';
  if (!list.length) { sourcesEl.innerHTML = header + '<em style="color:#888">No sources.</em>'; return; }
  sourcesEl.innerHTML = header + list.map(s => {
    const url = GH_BASE + s.path;
    return `<div class="source"><span class="id">[${s.id}]</span>` +
           `<a class="path" href="${escapeHtml(url)}" target="_blank" rel="noopener">${escapeHtml(s.path)}</a>` +
           (s.heading ? `<div class="heading">${escapeHtml(s.heading)}</div>` : '') +
           `</div>`;
  }).join('');
}

function linkifyCitations(text) {
  const escaped = escapeHtml(text);
  return escaped.replace(/\[(\d+(?:\s*,\s*\d+)*)\]/g, (m, group) => {
    const ids = group.split(/\s*,\s*/);
    const parts = ids.map(id => {
      const src = currentSources.find(s => String(s.id) === id);
      if (!src) return id;
      const url = GH_BASE + src.path;
      return `<a class="cite" href="${escapeHtml(url)}" target="_blank" rel="noopener" title="${escapeHtml(src.path)}">${id}</a>`;
    });
    return '[' + parts.join(', ') + ']';
  });
}

async function send() {
  const q = inputEl.value.trim();
  if (!q) return;
  inputEl.value = '';
  sendBtn.disabled = true;
  addMsg('user', q);
  history.push({ role: 'user', content: q });
  const outDiv = addMsg('assistant', '…');
  let full = '';
  let detectedState = null;

  try {
    const resp = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history }),
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0) {
        const ev = buf.slice(0, idx); buf = buf.slice(idx + 2);
        let type = 'message', data = '';
        for (const line of ev.split('\n')) {
          if (line.startsWith('event:')) type = line.slice(6).trim();
          else if (line.startsWith('data:')) data += line.slice(5).trim();
        }
        if (!data) continue;
        const payload = JSON.parse(data);
        if (type === 'state') { detectedState = payload.state; }
        else if (type === 'sources') renderSources(payload, detectedState);
        else if (type === 'error') { outDiv.className = 'msg error'; outDiv.textContent = 'Error: ' + payload.error; return; }
        else if (type === 'done') {
          history.push({ role: 'assistant', content: full });
          outDiv.innerHTML = linkifyCitations(full);
        }
        else if (payload.delta) {
          if (full === '') outDiv.textContent = '';
          full += payload.delta;
          outDiv.textContent = full;
          messagesEl.scrollTop = messagesEl.scrollHeight;
        }
      }
    }
  } catch (e) {
    outDiv.className = 'msg error';
    outDiv.textContent = 'Error: ' + e.message;
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.onclick = send;
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
inputEl.focus();
</script>
</body>
</html>
