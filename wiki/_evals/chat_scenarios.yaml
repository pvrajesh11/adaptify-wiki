# Conversation eval — multi-turn chat scenarios.
#
# Purpose: Phase 0 baseline for the chat experience. Single-turn evals (run_evals.py
# for retrieval, chat_evals.py for refusal) cannot measure entity inheritance across
# turns, slot-filling on underspecified queries, or refusal cleanliness inside a
# multi-turn flow. This file is the target every later phase tries to beat.
#
# Each scenario is a sequence of turns (1+). Each turn declares an `expected_action`
# (answer | clarify | refuse) and the dimensions that should be scored. The runner
# (tools/chat_scenarios.py) replays the scenario through the same retrieval + chat
# pipeline as production (tools/chat/server.py), so the baseline reflects what the
# user actually experiences today.
#
# Schema notes:
#   - `id`                        scenario id (s001, s002, ...)
#   - `cq_category`               manuals | forms | filings | objections | product-spec
#   - `role`                      pm | pds | actuary
#   - `description`               human spot-check; not scored
#   - `turns[]`
#       - `turn`                  1-based turn index
#       - `question`              user message
#       - `expected_action`       answer | clarify | refuse
#       - `introduces_entities`   facets the user introduces this turn (state, lob, ...)
#       - `inherits_entities`     facets the runner expects to carry over from prior turns
#       - `expected_must_cite`    paths that MUST appear in this turn's sources (action=answer only)
#       - `expected_optional_cite`paths nice-to-have (action=answer only)
#       - `expected_topics`       case-insensitive substrings the answer should contain (action=answer only)
#       - `expected_clarification_topics` substrings to look for in the response (action=clarify only)
#       - `expected_refusal_topic`        free-form note for human spot-check (action=refuse only)
#
# Paths are relative to wiki/ root. Keep this file human-editable.

version: 1
generated: 2026-04-23
notes: "10 scenarios drawn from Common Questions doc, translated to states we have ingested (AK / AL / AZ / CA / FL). Initial bar is strict — every turn must pass every applicable dimension for the scenario to pass. Expect failures on multi-turn entity inheritance (s001 turn 2, s002 turn 2, s010 turns 2-3) since today's chat is stateless and re-detects state from the LAST user message only."

