# Wiki retrieval eval — seed set
#
# Purpose: regression benchmark for any retrieval change (chunking, embeddings,
# hybrid weights, reranker). Every entry has a question, the expected intent,
# the wiki pages that SHOULD surface in the top-k retrieval, and Common-Questions
# taxonomy facets (cq_category, role) so recall can be sliced by audience.
#
# Scoring:
#   - recall@k on `must_cite`     (primary; every must-cite must appear in top-k)
#   - recall@k on `optional_cite` (secondary; nice-to-have)
#   - per-category and per-role recall (run_evals.py prints breakdowns)
#   - answer_hint is for human spot-check of generated answers, not automated
#
# `expected`:
#   - in_scope     — wiki should answer; must_cite required
#   - out_of_scope — wiki has a known content gap; chatbot should refuse
#                    cleanly (no fabrication). must_cite is empty.
#                    Refusal evaluated by chat_evals.py, not run_evals.py.
#
# `cq_category`: manuals | forms | filings | objections | product-spec
# `role`:        pm | pds | actuary
#
# Paths are relative to wiki/ root.
# Keep this file human-editable. No auto-generation.

